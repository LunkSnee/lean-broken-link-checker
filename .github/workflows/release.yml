name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release with the installable plugin zip.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches VERSION
        run: bin/version.sh check "$GITHUB_REF_NAME"

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Build plugin zip
        run: bin/build.sh

      - name: Release notes from CHANGELOG.md
        run: |
          version=$(bin/version.sh)
          awk -v head="## [$version] " 'index($0, head) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if grep -qx -- '- *' release-notes.md; then echo "CHANGELOG.md entry for $version still has an empty item" >&2; exit 1; fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
